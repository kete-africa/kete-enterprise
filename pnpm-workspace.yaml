packages:
  - apps/*

# Build scripts run only when approved here.
allowBuilds:
  esbuild: true
  # Optional native builds of the Testcontainers stack (ssh2): the JavaScript fallbacks suffice.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # @kete/files reads with officeparser, which brings Tesseract for an OCR Kete does not use
  # (scans go to the model).
  tesseract.js: false

# Kete's own packages are trusted as soon as kete-core publishes them; everything else waits for
# pnpm's minimum release age.
minimumReleaseAgeExclude:
  - '@kete-africa/*'

overrides:
  # vitest 3 locks a tinypool with known flaws (GHSA-85c8-ppgw-ccpr and its sibling); 2.1.2 fixes
  # them and keeps the same pool interface.
  vitest>tinypool: ^2.1.2
  # Fixed versions of high advisories published in October 2026, until each dependent asks for them:
  # @mcp-ui/client's MCP SDK (GHSA-22jm-h49p-29qw, GHSA-46jr-4wx8-v453), vite 7 (GHSA-587h-7wmj-h5pm).
  '@modelcontextprotocol/sdk@>=1.3.0 <1.32.0': ^1.32.1
  'vite@>=7.0.0 <7.3.7': ^7.3.7
  # Zod can exhaust memory validating oversized input (GHSA-mrhx-c7xc-m3w5, 2026-10-23): zod 4
  # lifted to 4.6.6, and the MCP SDK and MCP Apps, which accept zod 4, given it.
  'zod@>=4.0.0 <4.6.6': ^4.6.6
  '@modelcontextprotocol/sdk>zod': ^4.6.6
  '@modelcontextprotocol/ext-apps>zod': ^4.6.6
  # body-parser under Mastra's A2A server (DoS, published 2026-10-23): fixed in 2.4.0.
  'body-parser@>=2.0.0 <2.4.0': ^2.4.0

# Advisories without a fix where they are left (reviewed at each release):
auditConfig:
  ignoreGhsas:
    # Zod 3, which has no fixed 3.x, remains only under @kete/design's DESIGN.md tooling (build
    # time, Kete's own file) and @mcp-ui/client, which validates in her browser what an app's view
    # sends to its own frame; every zod at the server is 4.6.6 or later.
    - GHSA-mrhx-c7xc-m3w5
